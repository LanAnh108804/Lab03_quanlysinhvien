<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdminLTE 4 - Quản Lý Sinh Viên</title>
    <!-- AdminLTE 4 / Bootstrap 5 CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta2/dist/css/adminlte.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.min.css">
    <style>
        .action-column {
            width: 100px;
        }
    </style>
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
    <div class="app-wrapper">
        
        <!-- Header -->
        <nav class="app-header navbar navbar-expand bg-body">
            <div class="container-fluid">
                <ul class="navbar-nav">
                    <li class="nav-item"> <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button" aria-label="Mở menu" title="Mở menu"><i class="bi bi-list"></i></a> </li>
                    <li class="nav-item d-none d-md-block"> <a href="/students" class="nav-link">Trang chủ</a> </li>
                </ul>
            </div>
        </nav>

        <!-- Sidebar -->
        <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
            <div class="sidebar-brand"> 
                <a href="/students" class="brand-link"> 
                    <span class="brand-text fw-light"><b>Admin</b>LTE v4</span> 
                </a> 
            </div>
            <div class="sidebar-wrapper">
                <nav class="mt-2">
                    <ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview">
                        <li class="nav-item">
                            <a href="/students" class="nav-link active">
                                <i class="nav-icon bi bi-people-fill"></i>
                                <p>Quản lý sinh viên</p>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="app-main">
            <div class="app-content-header">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-sm-6"><h3 class="mb-0">Quản Lý Sinh Viên</h3></div>
                    </div>
                </div>
            </div>

            <div class="app-content">
                <div class="container-fluid">
                    <div class="row g-4">
                        
                        <!-- Form Thêm Sinh Viên -->
                        <div class="col-md-4">
                            <div class="card card-primary card-outline">
                                <div class="card-header"><div class="card-title">Thêm Sinh Viên Mới</div></div>
                                <form th:action="@{/students/add}" th:object="${newStudent}" method="post">
                                    <div class="card-body">
                                        <div class="mb-3">
                                            <label class="form-label" for="fullName">Họ và Tên</label>
                                            <input type="text" class="form-control" id="fullName" th:field="*{fullName}" required>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label" for="email">Email</label>
                                            <input type="email" class="form-control" id="email" th:field="*{email}" required>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label" for="phone">Số Điện Thoại</label>
                                            <input type="text" class="form-control" id="phone" th:field="*{phone}">
                                        </div>
                                    </div>
                                    <div class="card-footer">
                                        <button type="submit" class="btn btn-primary">Thêm mới</button>
                                    </div>
                                </form>
                            </div>
                        </div>

                        <!-- Bảng Danh Sách Sinh Viên -->
                        <div class="col-md-8">
                            <div class="card mb-4">
                                <div class="card-header"><h3 class="card-title">Danh Sách Sinh Viên</h3></div>
                                <div class="card-body p-0">
                                    <table class="table table-striped align-middle">
                                        <thead>
                                            <tr>
                                                <th>ID</th>
                                                <th>Họ và Tên</th>
                                                <th>Email</th>
                                                <th>Số Điện Thoại</th>
                                                <th class="action-column">Thao tác</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr th:each="student : ${students}">
                                                <td th:text="${student.id}"></td>
                                                <td th:text="${student.fullName}"></td>
                                                <td th:text="${student.email}"></td>
                                                <td th:text="${student.phone}"></td>
                                                <td>
                                                    <a th:href="@{/students/delete/{id}(id=${student.id})}" 
                                                       class="btn btn-danger btn-sm"
                                                       onclick="return confirm('Xác nhận xóa sinh viên này?');">
                                                        <i class="bi bi-trash"></i> Xóa
                                                    </a>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta2/dist/js/adminlte.min.js"></script>
</body>
</html>
